#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "llm-chat"
version = "0.1.0"
authors = ["ymori <you@example.com>"]
description = ""

[[trigger.http]]
route = "/..."
component = "llm-chat"

[variables]
backend_url = { required = true, description = "Zuplo AI Gateway base URL for this app, e.g. https://<your-gateway>.zuplo.app" }
model = { default = "google_gemma-4-26B-A4B-it-Q4_K_M.gguf" }
zuplo_api_key = { required = true, secret = true }
max_tokens = { default = "200" }

[component.llm-chat]
source = "target/wasm32-wasip1/release/llm_chat.wasm"
# Egress is locked to exactly the configured gateway host — the component
# cannot reach any other host regardless of what application code does.
allowed_outbound_hosts = ["{{ backend_url }}"]
[component.llm-chat.variables]
backend_url = "{{ backend_url }}"
model = "{{ model }}"
zuplo_api_key = "{{ zuplo_api_key }}"
max_tokens = "{{ max_tokens }}"
[component.llm-chat.build]
command = "cargo build --target wasm32-wasip1 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
