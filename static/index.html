<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin LLM Chat</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 1.5rem;
    background: #0f1115;
    color: #e8e8e8;
  }
  h1 { font-size: 1.1rem; font-weight: 600; color: #9aa5ff; margin-bottom: 0.25rem; }
  .sub { font-size: 0.8rem; color: #888; margin-bottom: 1rem; }
  #log {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    min-height: 50vh;
    border: 1px solid #2a2d35;
    border-radius: 8px;
    padding: 1rem;
    overflow-y: auto;
    background: #15171d;
  }
  .msg { padding: 0.6rem 0.8rem; border-radius: 8px; line-height: 1.4; white-space: pre-wrap; max-width: 85%; }
  .user { align-self: flex-end; background: #2b3a67; }
  .assistant { align-self: flex-start; background: #23262f; }
  .system { align-self: center; font-size: 0.8rem; color: #999; }
  form { display: flex; gap: 0.5rem; margin-top: 1rem; }
  input[type=text] {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    border: 1px solid #2a2d35;
    background: #15171d;
    color: #e8e8e8;
    font-size: 1rem;
  }
  button {
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    border: none;
    background: #6c7bff;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <h1>Spin LLM Chat</h1>
  <div class="sub">Rust + Fermyon Spin / backend: Gemma (OpenAI-compatible)</div>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="メッセージを入力..." autocomplete="off" />
    <button id="send" type="submit">送信</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const history = [];

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;

  history.push({ role: 'user', content: text });
  addBubble('user', text);
  const pending = addBubble('assistant', '...');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) {
      const err = await res.text();
      pending.textContent = 'エラー: ' + err;
      pending.className = 'msg system';
      return;
    }
    const data = await res.json();
    pending.textContent = data.reply;
    history.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    pending.textContent = '通信エラー: ' + err;
    pending.className = 'msg system';
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
