spec:
  image: "ghcr.io/ymori-aka/spin-llm-chat:latest"
  executor: containerd-shim-spin
  replicas: 1
  variables:
  - name: backend_url
    value: https://ec-chat-main-c4d1d89.zuplo.app/config_3114835392f54da99555e30c95cd15a6
